name: Deploy to Coolify

# Automatically runs every time you push to main
on:
  push:
    branches: [ main ]

jobs:
  # ── Step 1: Build check ────────────────────────────────────────────────────
  # Catches broken code BEFORE it hits the live server
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            Client/package-lock.json
            Server/package-lock.json

      - name: Install and build frontend
        run: |
          cd Client
          npm ci
          npm run build

      - name: Install backend dependencies
        run: |
          cd Server
          npm ci

  # ── Step 2: Deploy (only runs if build-check passes) ──────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - name: Trigger Frontend redeploy on Coolify
        uses: fjogeleit/http-request-action@v1
        with:
          url: ${{ secrets.COOLIFY_FRONTEND_WEBHOOK }}
          method: 'GET'
          timeout: 30000

      - name: Trigger Backend redeploy on Coolify
        uses: fjogeleit/http-request-action@v1
        with:
          url: ${{ secrets.COOLIFY_BACKEND_WEBHOOK }}
          method: 'GET'
          timeout: 30000

      - name: Done
        run: echo "Frontend and backend deploys triggered on Coolify"
